name: Database Tests

on:
  pull_request:
    paths:
      - "supabase/**"
      - "scripts/local-notification-auth-smoke.mjs"
      - "scripts/local-study-auth-smoke.mjs"
      - ".github/workflows/database-tests.yml"
  push:
    branches:
      - main
    paths:
      - "supabase/**"
      - "scripts/local-notification-auth-smoke.mjs"
      - ".github/workflows/database-tests.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prayer-care-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.110.0

      - name: Start isolated Supabase
        run: supabase start

      - name: Test database RLS and ministry workflows
        run: supabase test db

      - name: Install Node.js for real Auth and REST smoke
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies for local-only smoke
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Verify synthetic Auth and REST notification isolation
        run: node scripts/local-notification-auth-smoke.mjs

      - name: Verify synthetic Auth and REST Bible-study privacy
        run: node scripts/local-study-auth-smoke.mjs
