name: Database Tests

on:
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/database-tests.yml"
  push:
    branches:
      - main
    paths:
      - "supabase/**"
      - ".github/workflows/database-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prayer-care-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.110.0

      - name: Start isolated Supabase
        run: supabase start

      - name: Test prayer-care database lifecycle
        run: supabase test db
