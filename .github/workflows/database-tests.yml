name: Database Tests

on:
  pull_request:
    paths:
      - "supabase/**"
      - "tests/*.sql"
      - ".github/workflows/database-tests.yml"
  push:
    branches:
      - main
    paths:
      - "supabase/**"
      - "tests/*.sql"
      - ".github/workflows/database-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prayer-care-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.110.0

      - name: Start isolated Supabase
        run: supabase start

      - name: Test prayer-care database lifecycle
        run: supabase test db

      - name: Test RLS helper authorization against local database
        env:
          PGPASSWORD: postgres
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54322 -U postgres -d postgres -f tests/rls-helper-caller-isolation.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54322 -U postgres -d postgres -f tests/rls-helper-positive-access.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54322 -U postgres -d postgres -f tests/group-membership-permissions.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54322 -U postgres -d postgres -f tests/prayer-trigger-contract.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54322 -U postgres -d postgres -f tests/prayer-hosted-trigger-reproduction.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54322 -U postgres -d postgres -f tests/community-moderation-schema-contract.sql

          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54322 -U postgres -d postgres -f tests/prayer-two-member-rls.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54322 -U postgres -d postgres -f tests/prayer-transition-safety.sql
