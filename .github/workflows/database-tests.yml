name: Database Tests

on:
  pull_request:
    paths:
      - "supabase/**"
      - "scripts/rehearse-daily-path-policy-repair.mjs"
      - ".github/workflows/database-tests.yml"
  push:
    branches:
      - main
    paths:
      - "supabase/**"
      - "scripts/rehearse-daily-path-policy-repair.mjs"
      - ".github/workflows/database-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prayer-care-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.110.0

      - name: Start isolated Supabase
        run: supabase start

      - name: Test prayer-care database lifecycle and repaired Daily Path RLS
        run: supabase test db

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rehearse old hosted RLS drift repair without committing changes
        run: node scripts/rehearse-daily-path-policy-repair.mjs
