name: Database Tests

on:
  pull_request:
    paths:
      - "supabase/**"
      - "tests/*.sql"
      - "scripts/local-notification-auth-smoke.mjs"
      - "scripts/local-study-auth-smoke.mjs"
      - "scripts/local-giving-auth-smoke.mjs"
      - "scripts/local-app-study-http-smoke.mjs"
      - ".github/workflows/database-tests.yml"
  push:
    branches:
      - main
    paths:
      - "supabase/**"
      - "tests/*.sql"
      - "scripts/local-notification-auth-smoke.mjs"
      - "scripts/local-study-auth-smoke.mjs"
      - "scripts/local-giving-auth-smoke.mjs"
      - "scripts/local-app-study-http-smoke.mjs"
      - ".github/workflows/database-tests.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prayer-care-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.110.0

      - name: Start isolated Supabase
        run: supabase start

      - name: Test database RLS and ministry workflows
        run: supabase test db

      - name: Install Node.js for real Auth and REST smoke
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies for local-only smoke
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Verify synthetic Auth and REST notification isolation
        run: node scripts/local-notification-auth-smoke.mjs

      - name: Verify synthetic Auth and REST Bible-study privacy
        run: node scripts/local-study-auth-smoke.mjs

      - name: Verify synthetic Auth and REST donor identity isolation
        run: node scripts/local-giving-auth-smoke.mjs

      - name: Verify authenticated Next.js Daily Path page isolation
        run: node scripts/local-app-study-http-smoke.mjs

      - name: Test RLS helper authorization against local database
        env:
          PGPASSWORD: postgres
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54322 -U postgres -d postgres -f tests/rls-helper-caller-isolation.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54322 -U postgres -d postgres -f tests/rls-helper-positive-access.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54322 -U postgres -d postgres -f tests/group-membership-permissions.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54322 -U postgres -d postgres -f tests/prayer-trigger-contract.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54322 -U postgres -d postgres -f tests/prayer-hosted-trigger-reproduction.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54322 -U postgres -d postgres -f tests/community-moderation-schema-contract.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54322 -U postgres -d postgres -f tests/testimony-legacy-migration-integration.sql

          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54322 -U postgres -d postgres -f tests/prayer-two-member-rls.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54322 -U postgres -d postgres -f tests/prayer-transition-safety.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54322 -U postgres -d postgres -f tests/prayer-owner-guard-integration.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54322 -U postgres -d postgres -f tests/prayer-owner-guard-migration-integration.sql
